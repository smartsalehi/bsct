<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مقالات و آموزش‌ها | خانه هوشمند مشهد</title>
<meta name="description" content="مقالات و آموزش‌های خانه هوشمند: انتخاب سیم‌کشی، مقایسه kNX و بی‌سیم، طراحی سناریوی روشنایی و صرفه‌جویی انرژی.">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preload" href="assets/fonts/Vazirmatn-Variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/css/site.css">
</head>
<body data-page="articles">
<header id="site-header" class="site-header"></header>

<main id="app">
  <section class="page-hero">
    <div class="wrap">
      <div class="crumbs"><a href="index.html">خانه</a><span>/</span><span>مقالات و آموزش‌ها</span></div>
      <span class="eyebrow">دانش‌نامه</span>
      <h1>مقالات و آموزش‌های <span class="grad-text">خانه هوشمند</span></h1>
      <p>هر چیزی که پیش از تصمیم‌گیری درباره هوشمندسازی باید بدانید؛ از انتخاب زیرساخت تا طراحی سناریو و نگهداری سیستم.</p>
    </div>
  </section>

  <section class="section section--tight">
    <div class="wrap">
      <div class="filters" id="filters"></div>
      <div class="grid grid--3" id="article-grid"></div>
    </div>
  </section>

  <section class="section section--tight">
    <div class="wrap">
      <div class="cta-band">
        <div>
          <h2>سؤال فنی دارید؟</h2>
          <p>تیم فنی ما آماده پاسخ‌گویی به پرسش‌های تخصصی شما درباره محصولات و اجرای پروژه است.</p>
        </div>
        <a class="btn btn--gold" href="contact.html">پرسش خود را بفرستید</a>
      </div>
    </div>
  </section>
</main>

<footer id="site-footer" class="site-footer"></footer>
<script src="assets/js/core.js"></script>
<script>
App.boot((site) => {
  const articles = site.articles;
  const cats = ["همه", ...Array.from(new Set(articles.map((a) => a.category)))];
  let active = "همه";
  const grid = document.getElementById("article-grid");

  document.getElementById("filters").innerHTML =
    cats.map((c) => `<button class="filter-btn ${c === "همه" ? "active" : ""}" data-cat="${App.escapeHtml(c)}">${App.escapeHtml(c)}</button>`).join("") +
    `<input class="input" id="search" placeholder="جستجو در مقالات…" style="max-width:260px;margin-inline-start:auto" />`;

  function render() {
    const q = (document.getElementById("search")?.value || "").trim();
    const list = articles.filter(
      (a) => (active === "همه" || a.category === active) && (!q || (a.title + a.excerpt + (a.tags || []).join(" ")).includes(q))
    );
    grid.innerHTML = list.length ? list.map(App.articleCard).join("") : `<div class="alert alert--err show" style="grid-column:1/-1">مقاله‌ای با این مشخصات یافت نشد.</div>`;
    App.reveal();
  }

  document.getElementById("filters").addEventListener("click", (e) => {
    const b = e.target.closest(".filter-btn");
    if (!b) return;
    App.$$(".filter-btn").forEach((x) => x.classList.remove("active"));
    b.classList.add("active");
    active = b.dataset.cat;
    render();
  });
  document.getElementById("search").addEventListener("input", render);

  render();
});
</script>
</body>
</html>
